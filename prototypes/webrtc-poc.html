<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol v3 WebRTC Proof of Concept</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0b0b0b;
            color: #e0e0e0;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #2ddc6c;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        button.danger {
            background: #ff5252;
            color: #fff;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        .status.info { background: #1e3a5f; color: #6fb3ff; }
        .status.success { background: #1e3f2f; color: #6fffa5; }
        .status.error { background: #3f1e1e; color: #ff6f6f; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .metric {
            background: #0f0f0f;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
        }
        .metric-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #2ddc6c;
        }
        #log {
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 0;
        }
        .log-entry.info { color: #6fb3ff; }
        .log-entry.success { color: #6fffa5; }
        .log-entry.error { color: #ff6f6f; }
        .log-entry.warn { color: #ffc107; }
    </style>
</head>
<body>
    <h1>🔮 Protocol v3: WebRTC Proof of Concept</h1>

    <div class="card">
        <h2>Connection</h2>
        <div>
            <label>OpenAI API Key:
                <input type="password" id="apiKey" placeholder="sk-..." style="width: 300px; padding: 8px;">
            </label>
        </div>
        <div style="margin-top: 10px;">
            <button id="btnConnect" onclick="connect()">Connect via WebRTC</button>
            <button id="btnDisconnect" onclick="disconnect()" disabled class="danger">Disconnect</button>
        </div>
        <div id="connectionStatus" class="status info">Ready to connect</div>
    </div>

    <div class="card">
        <h2>Audio</h2>
        <div>
            <audio id="remoteAudio" autoplay></audio>
        </div>
        <div>
            <button id="btnStartMic" onclick="startMicrophone()" disabled>Start Microphone</button>
            <button id="btnStopMic" onclick="stopMicrophone()" disabled class="danger">Stop Microphone</button>
        </div>
        <div id="audioStatus" class="status info">Microphone not started</div>
    </div>

    <div class="card">
        <h2>Metrics</h2>
        <div class="metrics">
            <div class="metric">
                <div class="metric-label">Connection State</div>
                <div class="metric-value" id="metricConnState">-</div>
            </div>
            <div class="metric">
                <div class="metric-label">ICE State</div>
                <div class="metric-value" id="metricIceState">-</div>
            </div>
            <div class="metric">
                <div class="metric-label">Packets Lost</div>
                <div class="metric-value" id="metricPacketsLost">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">RTT (ms)</div>
                <div class="metric-value" id="metricRTT">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Jitter (ms)</div>
                <div class="metric-value" id="metricJitter">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Bytes Sent</div>
                <div class="metric-value" id="metricBytesSent">0</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Debug Log</h2>
        <button onclick="clearLog()">Clear Log</button>
        <div id="log"></div>
    </div>

    <script>
        let pc = null;
        let dataChannel = null;
        let localStream = null;
        let statsInterval = null;

        // Logging
        function log(message, level = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${level.toUpperCase()}]`, message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStatus(elementId, message, className) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `status ${className}`;
        }

        function updateMetric(metricId, value) {
            document.getElementById(metricId).textContent = value;
        }

        // WebRTC Connection
        async function connect() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey || !apiKey.startsWith('sk-')) {
                alert('Please enter a valid OpenAI API key (starts with sk-)');
                return;
            }

            try {
                document.getElementById('btnConnect').disabled = true;
                updateStatus('connectionStatus', 'Creating RTCPeerConnection...', 'info');
                log('Starting WebRTC connection', 'info');

                // Create RTCPeerConnection
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                });

                // Connection state monitoring
                pc.onconnectionstatechange = () => {
                    log(`Connection state: ${pc.connectionState}`, 'info');
                    updateMetric('metricConnState', pc.connectionState);

                    if (pc.connectionState === 'connected') {
                        updateStatus('connectionStatus', 'Connected via WebRTC!', 'success');
                        document.getElementById('btnDisconnect').disabled = false;
                        document.getElementById('btnStartMic').disabled = false;
                        log('WebRTC connection established!', 'success');
                    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                        updateStatus('connectionStatus', `Connection ${pc.connectionState}`, 'error');
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    log(`ICE state: ${pc.iceConnectionState}`, 'info');
                    updateMetric('metricIceState', pc.iceConnectionState);
                };

                pc.onicegatheringstatechange = () => {
                    log(`ICE gathering: ${pc.iceGatheringState}`, 'info');
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        log(`ICE candidate: ${event.candidate.type} ${event.candidate.protocol}`, 'info');
                    } else {
                        log('ICE gathering complete', 'info');
                    }
                };

                // Handle incoming audio
                pc.ontrack = (event) => {
                    log(`Received remote track: ${event.track.kind}`, 'success');
                    if (event.track.kind === 'audio') {
                        const remoteAudio = document.getElementById('remoteAudio');
                        remoteAudio.srcObject = event.streams[0];
                        log('Remote audio connected to <audio> element', 'success');
                    }
                };

                // Create data channel for events
                dataChannel = pc.createDataChannel('oai-events', {
                    ordered: true
                });

                dataChannel.onopen = () => {
                    log('Data channel opened', 'success');
                    // Send session configuration
                    sendDataChannelMessage({
                        type: 'session.update',
                        session: {
                            modalities: ['audio', 'text'],
                            instructions: 'You are a helpful AI assistant. Keep responses brief and conversational.',
                            voice: 'alloy',
                            input_audio_format: 'pcm16',
                            output_audio_format: 'pcm16',
                            turn_detection: {
                                type: 'server_vad',
                                threshold: 0.5,
                                prefix_padding_ms: 300,
                                silence_duration_ms: 500
                            }
                        }
                    });
                };

                dataChannel.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        log(`Data channel event: ${msg.type}`, 'info');

                        if (msg.type === 'error') {
                            log(`OpenAI error: ${msg.error?.message || 'Unknown error'}`, 'error');
                        }
                    } catch (err) {
                        log(`Data channel parse error: ${err.message}`, 'error');
                    }
                };

                dataChannel.onerror = (error) => {
                    log(`Data channel error: ${error}`, 'error');
                };

                dataChannel.onclose = () => {
                    log('Data channel closed', 'warn');
                };

                // Create SDP offer
                updateStatus('connectionStatus', 'Creating SDP offer...', 'info');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                log('SDP offer created', 'success');

                // Wait for ICE gathering to complete
                await new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        const checkState = () => {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', checkState);
                    }
                });

                // Send offer to OpenAI
                updateStatus('connectionStatus', 'Sending SDP to OpenAI...', 'info');
                log('Sending SDP offer to OpenAI', 'info');

                const formData = new FormData();
                formData.append('sdp', pc.localDescription.sdp);
                formData.append('model', 'gpt-4o-realtime-preview-2024-12-17');

                const response = await fetch('https://api.openai.com/v1/realtime/sessions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                    },
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`OpenAI API error: ${response.status} ${error}`);
                }

                const data = await response.json();
                log('Received SDP answer from OpenAI', 'success');

                // Set remote description
                await pc.setRemoteDescription({
                    type: 'answer',
                    sdp: data.sdp
                });
                log('Remote SDP set successfully', 'success');

                updateStatus('connectionStatus', 'Waiting for connection...', 'info');

                // Start stats monitoring
                startStatsMonitoring();

            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
                updateStatus('connectionStatus', `Error: ${error.message}`, 'error');
                document.getElementById('btnConnect').disabled = false;
                if (pc) {
                    pc.close();
                    pc = null;
                }
            }
        }

        async function disconnect() {
            log('Disconnecting...', 'info');

            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }

            if (pc) {
                pc.close();
                pc = null;
            }

            document.getElementById('btnConnect').disabled = false;
            document.getElementById('btnDisconnect').disabled = true;
            document.getElementById('btnStartMic').disabled = true;
            document.getElementById('btnStopMic').disabled = true;

            updateStatus('connectionStatus', 'Disconnected', 'info');
            updateStatus('audioStatus', 'Microphone stopped', 'info');
            log('Disconnected', 'success');
        }

        // Microphone
        async function startMicrophone() {
            try {
                log('Requesting microphone access...', 'info');
                updateStatus('audioStatus', 'Requesting microphone...', 'info');

                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 24000
                    }
                });

                log('Microphone access granted', 'success');

                // Add audio track to peer connection
                const audioTrack = localStream.getAudioTracks()[0];
                pc.addTrack(audioTrack, localStream);

                log('Audio track added to peer connection', 'success');
                updateStatus('audioStatus', 'Microphone active', 'success');

                document.getElementById('btnStartMic').disabled = true;
                document.getElementById('btnStopMic').disabled = false;

            } catch (error) {
                log(`Microphone error: ${error.message}`, 'error');
                updateStatus('audioStatus', `Error: ${error.message}`, 'error');
            }
        }

        function stopMicrophone() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                log('Microphone stopped', 'info');
                updateStatus('audioStatus', 'Microphone stopped', 'info');
                document.getElementById('btnStartMic').disabled = false;
                document.getElementById('btnStopMic').disabled = true;
            }
        }

        // Stats monitoring
        function startStatsMonitoring() {
            statsInterval = setInterval(async () => {
                if (!pc) return;

                try {
                    const stats = await pc.getStats();
                    let packetsLost = 0;
                    let rtt = 0;
                    let jitter = 0;
                    let bytesSent = 0;

                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.kind === 'audio') {
                            packetsLost = report.packetsLost || 0;
                            jitter = report.jitter ? (report.jitter * 1000).toFixed(1) : 0;
                        }
                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                            rtt = report.currentRoundTripTime ? (report.currentRoundTripTime * 1000).toFixed(0) : 0;
                        }
                        if (report.type === 'outbound-rtp' && report.kind === 'audio') {
                            bytesSent = report.bytesSent || 0;
                        }
                    });

                    updateMetric('metricPacketsLost', packetsLost);
                    updateMetric('metricRTT', rtt);
                    updateMetric('metricJitter', jitter);
                    updateMetric('metricBytesSent', bytesSent);

                } catch (error) {
                    // Ignore stats errors
                }
            }, 1000);
        }

        // Data channel helpers
        function sendDataChannelMessage(message) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(message));
                log(`Sent: ${message.type}`, 'info');
            } else {
                log('Data channel not open, cannot send message', 'warn');
            }
        }

        // Initialize
        log('Protocol v3 WebRTC PoC loaded', 'success');
        log('Enter your OpenAI API key and click Connect', 'info');
    </script>
</body>
</html>
