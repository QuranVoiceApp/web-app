name: e2e-manual

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  e2e-chromium:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test --reporter=line,html --trace on --project=chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/**
          if-no-files-found: warn
      - name: Backend metrics gate (prod)
        run: |
          set -e
          json=$(curl -fsSL https://quran.asimo.io/api/metrics/health)
          read empty deferred underrun <<EOF
          $(echo "$json" | jq -r '.metrics // .counters | "\(.empty_commit_total // 0) \(.deferred_commit_total // 0) \(.tts_underrun_total // 0)"')
          EOF
          if [ "$empty" != "0" ]; then echo "empty_commit_total != 0: $empty"; exit 1; fi
          if [ "$underrun" != "0" ]; then echo "tts_underrun_total != 0: $underrun"; exit 1; fi
          if [ "$deferred" -le 0 ]; then echo "deferred_commit_total <= 0: $deferred"; exit 1; fi
          echo "Metrics gate OK: empty_commit_total=$empty deferred_commit_total=$deferred tts_underrun_total=$underrun"

  e2e-webkit:
    runs-on: macos-latest
    continue-on-error: true
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test --reporter=line,html --trace on --retries=2 --project=webkit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report/**
          if-no-files-found: warn
