name: Deploy Web App (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-bundle-chromium:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: |
          npm ci || npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: run full e2e matrix (Chromium)
        run: |
          npx playwright test \
            tests/ui_pills.spec.ts \
            tests/ui/all-controls.spec.ts \
            tests/playback.spec.ts \
            tests/bargein.spec.ts \
            tests/jitter_buffer.spec.ts \
            --reporter=line,html --trace on --project=chromium
      - name: upload e2e artifacts (Chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-${{ github.run_id }}
          path: playwright-report/**
          if-no-files-found: warn
  e2e-transcript-chromium:
    name: non-blocking e2e-transcript (Chromium)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: |
          npm ci || npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: run transcript_match (Chromium)
        run: |
          npx playwright test \
            tests/transcript_match.spec.ts \
            --reporter=line,html --trace on --project=chromium
      - name: upload transcript artifacts (Chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-transcript-${{ github.run_id }}
          path: playwright-report/**
          if-no-files-found: warn
      - name: Metrics SLO gate (prod)
        id: slo
        if: always()
        run: |
          set -e
          curl -fsSL https://quran.asimo.io/api/metrics/health -o slo-metrics.json
          empty=$(jq -r '.metrics // .counters | (.empty_commit_total // 0)' slo-metrics.json)
          deferred=$(jq -r '.metrics // .counters | (.deferred_commit_total // 0)' slo-metrics.json)
          underrun=$(jq -r '.metrics // .counters | (.tts_underrun_total // 0)' slo-metrics.json)
          if [ "$empty" != "0" ]; then echo "empty_commit_total != 0: $empty"; exit 1; fi
          if [ "$underrun" != "0" ]; then echo "tts_underrun_total != 0: $underrun"; exit 1; fi
          if [ "$deferred" -le 0 ]; then echo "deferred_commit_total <= 0: $deferred"; exit 1; fi
          echo "empty=$empty" >> "$GITHUB_OUTPUT"
          echo "deferred=$deferred" >> "$GITHUB_OUTPUT"
          echo "underrun=$underrun" >> "$GITHUB_OUTPUT"
      - name: SLO summary
        if: always()
        run: |
          echo "✅ Metrics gate OK — empty: ${{ steps.slo.outputs.empty }}, deferred: ${{ steps.slo.outputs.deferred }}, tts_underrun: ${{ steps.slo.outputs.underrun }}" >> "$GITHUB_STEP_SUMMARY"
      - name: upload slo metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-metrics.json
          path: slo-metrics.json
          if-no-files-found: warn

  e2e-bundle-webkit:
    runs-on: macos-latest
    continue-on-error: true
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: |
          npm ci || npm i --no-audit --no-fund
          npx playwright install --with-deps
      - name: run e2e matrix (WebKit, flaky-tolerant)
        run: |
          npx playwright test \
            tests/ui_pills.spec.ts \
            tests/ui/all-controls.spec.ts \
            tests/playback.spec.ts \
            tests/transcript_match.spec.ts \
            tests/bargein.spec.ts \
            tests/jitter_buffer.spec.ts \
            --reporter=line,html --trace on --retries=2 --project=webkit
      - name: upload e2e artifacts (WebKit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-${{ github.run_id }}
          path: playwright-report/**
          if-no-files-found: warn

  e2e-webkit-docker:
    name: non-blocking e2e-webkit-docker
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-jammy
      options: --ipc=host
    env:
      BASE_URL: https://app.asimo.io/index.html
      HOME: /root
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install dependencies (in container)
        run: |
          npm ci || npm i --no-audit --no-fund
          npx playwright install webkit
      - name: run e2e matrix (WebKit Docker, non-blocking)
        run: |
          npx playwright test \
            tests/ui_pills.spec.ts \
            tests/ui/all-controls.spec.ts \
            tests/playback.spec.ts \
            tests/transcript_match.spec.ts \
            tests/bargein.spec.ts \
            tests/jitter_buffer.spec.ts \
            --reporter=line,html --trace on --retries=2 --project=webkit
      - name: upload e2e artifacts (WebKit Docker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-docker-${{ github.run_id }}
          path: playwright-report/**
          if-no-files-found: warn
  phase2-unit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: npm ci
      - name: run phase 2 unit tests
        run: |
          set -o pipefail
          npm run test:phase2 | tee phase2-unit.log
      - name: bundle phase 2 artifacts
        if: always()
        env:
          ACTIVE_FLAGS: "seq_json,fir_halfband,drift_comp,watchdog"
        run: |
          scripts/ci/collect_artifacts.sh phase2-artifacts phase2-unit.log
      - name: upload phase 2 unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-unit-${{ github.run_id }}
          path: phase2-artifacts

  phase3-bargein:
    needs: phase2-unit
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: run barge-in smoke
        continue-on-error: true
        env:
          BASE_URL: https://app.asimo.io/
          PHASE3_URL: https://app.asimo.io/?ff=barge_in,seq_json,fir_halfband,drift_comp,watchdog,sim_input&diag=1&auto=1&v=${{ github.sha }}
          SHORTSHA: ${{ github.sha }}
        run: npx playwright test tests/bargein.spec.ts --reporter=line,html --trace on --project=chromium
      - name: bundle phase 3 artifacts
        if: always()
        env:
          ACTIVE_FLAGS: "seq_json,barge_in,sim_input"
        run: |
          scripts/ci/collect_artifacts.sh phase3-artifacts playwright-report test-results
      - name: upload phase 3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-bargein-${{ github.run_id }}
          path: phase3-artifacts

  build:
    needs: [phase2-unit, phase3-bargein]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: npm ci
      - name: prepare artifact (static)
        run: |
          mkdir -p _site
          rsync -a --exclude "_site" ./ _site/
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  phase4-playback:
    needs: build
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://app.asimo.io/index.html
      SHORTSHA: ${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Phase 4 playback smoke (pb_polish)
        run: |
          npx playwright test tests/playback.spec.ts --reporter=line --project=chromium --project=ios-wk
      - name: Phase 4 jitter buffer mock (bursty deltas)
        run: |
          npx playwright test tests/jitterbuffer.mock.spec.ts --reporter=line --project=chromium
      - name: bundle phase 4 artifacts
        if: always()
        env:
          ACTIVE_FLAGS: "seq_json,pb_polish,sim_input"
        run: |
          scripts/ci/collect_artifacts.sh phase4-artifacts playwright-report test-results
      - name: upload phase 4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-playback-${{ github.run_id }}
          path: phase4-artifacts

  deploy:
    needs: [build, phase4-playback]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  phase5-ui:
    needs: phase4-playback
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASE_URL: https://app.asimo.io/index.html
      SHORTSHA: ${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Phase 5 UI pills smoke
        run: |
          npx playwright test tests/ui_pills.spec.ts --reporter=line --project=chromium
      - name: bundle phase 5 artifacts
        if: always()
        env:
          ACTIVE_FLAGS: "ui_pills,sim_input"
        run: |
          scripts/ci/collect_artifacts.sh phase5-artifacts playwright-report test-results
      - name: upload phase 5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-ui-${{ github.run_id }}
          path: phase5-artifacts
