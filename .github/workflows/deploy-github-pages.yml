name: Deploy Web App (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  phase2-unit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run phase 2 unit tests
        run: |
          set -o pipefail
          npm run test:phase2 | tee phase2-unit.log
      - name: bundle phase 2 artifacts
        if: always()
        env:
          ACTIVE_FLAGS: "seq_json,fir_halfband,drift_comp,watchdog"
        run: |
          scripts/ci/collect_artifacts.sh phase2-artifacts phase2-unit.log
      - name: upload phase 2 unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-unit-${{ github.run_id }}
          path: phase2-artifacts

  build:
    needs: phase2-unit
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: prepare artifact (static)
        run: |
          mkdir -p _site
          cp -R * _site/
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
