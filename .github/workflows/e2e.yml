name: e2e
on:
  workflow_dispatch:
  push:
    branches: [ fix/**, feat/**, main ]
jobs:
  e2e-chromium:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=chromium --reporter=list,html --trace on
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/**
          if-no-files-found: warn

  e2e-webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=webkit --reporter=list,html --trace on
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report/**
          if-no-files-found: warn
