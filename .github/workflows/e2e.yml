name: e2e
on:
  workflow_dispatch:
  push:
    branches: [ fix/**, feat/**, main ]
jobs:
  e2e-chromium:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=chromium --reporter=list,html --trace on
      - name: upload artifacts (chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/**
          if-no-files-found: warn
      - name: Backend metrics gate (prod)
        run: |
          set -e
          curl -fsSL https://quran.asimo.io/api/metrics/health -o slo-metrics.json
          empty=$(jq -r '.metrics // .counters | (.empty_commit_total // 0)' slo-metrics.json)
          deferred=$(jq -r '.metrics // .counters | (.deferred_commit_total // 0)' slo-metrics.json)
          underrun=$(jq -r '.metrics // .counters | (.tts_underrun_total // 0)' slo-metrics.json)
          if [ "$empty" != "0" ]; then echo "empty_commit_total != 0: $empty"; exit 1; fi
          if [ "$underrun" != "0" ]; then echo "tts_underrun_total != 0: $underrun"; exit 1; fi
          if [ "$deferred" -le 0 ]; then echo "deferred_commit_total <= 0: $deferred"; exit 1; fi
          echo "✅ Metrics gate OK — empty: $empty, deferred: $deferred, tts_underrun: $underrun" >> "$GITHUB_STEP_SUMMARY"
      - name: upload slo metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-metrics.json
          path: slo-metrics.json
          if-no-files-found: warn

  e2e-webkit:
    runs-on: macos-latest
    continue-on-error: true
    env:
      BASE_URL: https://app.asimo.io/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=webkit --reporter=list,html --trace on --retries=2
      - name: upload artifacts (webkit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report/**
          if-no-files-found: warn
